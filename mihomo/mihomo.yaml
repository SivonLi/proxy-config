# ============================================================================
# mihomo (Clash.Meta) 配置 —— 由 stash/stash.yaml 改写，适用于 ClashBar
# 内核校验版本：mihomo v1.19.33
#
# 使用前必须修改：
#   1. proxy-providers.Sub-Store-Subscribe.url 填写你自己的订阅地址
#      （地址含凭证，请只保存在本机，不要提交到仓库）
#   2. 其余内容无需修改；规则集合首次启动时由内核自动下载到 ./rules/
#
# 与 Stash 版的主要差异见文件内带 [mihomo] 标记的注释。
# ============================================================================

# ---- 通用 ----
# 端口、局域网访问、IPv6、日志级别等可在 ClashBar「设置」中覆盖。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
# [mihomo] 如 ClashBar 提示 API 鉴权失败 / bad response，检查此地址是否与其内核端口一致，
# 或被其他 Clash 系客户端占用。
external-controller: 127.0.0.1:9090

# [mihomo] Stash 自动记忆手动选择；mihomo 需要显式开启。
profile:
  store-selected: true
  store-fake-ip: true

# [mihomo] 默认关闭；在 ClashBar 中开启 TUN 时使用以下参数。
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  # [mihomo] Stash 默认就是 Fake-IP，mihomo 需要显式指定。
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # [mihomo] Stash 的 follow-rule 对应 respect-rules，默认关闭，无需填写。
  # 仅控制应用的 AAAA 查询；Stash 原配置同为关闭。
  ipv6: false
  # 内置 DNS 直连国内 DoH；Fake-IP 代理 TCP 连接由所选节点解析目标域名。
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
  # 公司域名交给系统解析，沿用 aTrust 的内网解析能力。
  nameserver-policy:
    'rule-set:corporate-domains': system
  # 公司、局域网与 Sukka 真实地址例外返回真实 IP。
  fake-ip-filter:
    - 'rule-set:corporate-domains'
    - 'rule-set:lan'
    - 'rule-set:fake-ip-exclude'

# [mihomo] Stash 通过 Subscribe.stoverride 注入订阅；mihomo 直接写在主配置里。
# Stash 里的 http://sub.store/... 只在 Stash 内部可用，这里需要换成可从本机访问的地址：
#   - 机场提供的 Clash/mihomo 订阅链接，或
#   - 自建 Sub-Store 的 .../download/collection/Subscribe?target=ClashMeta
proxy-providers:
  Sub-Store-Subscribe:
    type: http
    url: 'https://YOUR-SUBSCRIPTION-URL-HERE'
    path: ./providers/Sub-Store-Subscribe.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
      lazy: true

# 手动分组不做定时测速；命名地区按需测速，其他地区手动选择节点。
# [mihomo] 地区组的 proxies: [REJECT] 保证组永不为空（空组会回落到 DIRECT）；
#          filter 只作用于订阅节点，不会过滤静态写入的 REJECT。
proxy-groups:
  - name: 默认代理
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/proxy.png?v=2
    proxies: [香港, 日本, 美国, 新加坡, 台湾, 韩国, 欧洲, 其他地区]
  - name: AI
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/apple-intelligence.png?v=2
    proxies: [新加坡, 美国, 日本, 台湾, 韩国, 欧洲, 其他地区]
  - name: Lark
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/lark.png?v=2
    proxies: [日本, 默认代理]
  - name: Apple
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/apple.png?v=2
    proxies: [DIRECT, 默认代理, 美国]
  - name: Microsoft
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/microsoft.png?v=2
    proxies: [DIRECT, 默认代理]
  - name: 下载
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/download.png?v=2
    proxies: [默认代理, DIRECT]
  - name: 测速
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/speedtest.png?v=2
    proxies: [DIRECT, 香港, 日本, 美国, 新加坡, 台湾, 韩国, 欧洲, 其他地区]
  # REJECT 保证地区组始终非空；自动选择会跳过这个不可用出口。
  - name: 香港
    type: url-test
    url: http://www.gstatic.com/generate_204
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/hong-kong.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇭🇰|香港|(^|[^a-z])hkg?([^a-z]|$)|hong[ -]*kong'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 日本
    type: url-test
    url: http://www.gstatic.com/generate_204
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/japan.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇯🇵|日本|东京|東京|大阪|京都|(^|[^a-z])jpn?([^a-z]|$)|japan|tokyo|osaka'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 美国
    type: url-test
    url: http://www.gstatic.com/generate_204
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/united-states.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇺🇸|美国|美國|纽约|紐約|洛杉矶|洛杉磯|旧金山|舊金山|西雅图|西雅圖|(^|[^a-z])usa?([^a-z]|$)|america|united[ -]*states'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 新加坡
    type: url-test
    url: http://www.gstatic.com/generate_204
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/singapore.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇸🇬|新加坡|狮城|獅城|(^|[^a-z])sgp?([^a-z]|$)|singapore'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 台湾
    type: url-test
    url: http://www.gstatic.com/generate_204
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/taiwan.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇹🇼|台湾|台灣|臺灣|台北|臺北|高雄|(^|[^a-z])twn?([^a-z]|$)|taiwan'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 韩国
    type: url-test
    url: http://www.gstatic.com/generate_204
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/korea.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇰🇷|韩国|韓國|首尔|首爾|釜山|(^|[^a-z])kor?([^a-z]|$)|(^|[^a-z])kr([^a-z]|$)|korea|seoul|busan'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 欧洲
    type: url-test
    url: http://www.gstatic.com/generate_204
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/europe.png?v=2
    proxies: [REJECT]
    include-all: true
    # 英国、德国、荷兰等欧洲节点统一参与测速。
    filter: '(?i)^REJECT$|🇪🇺|🇬🇧|🇩🇪|🇳🇱|🇫🇷|🇮🇪|🇨🇭|🇸🇪|🇫🇮|🇳🇴|🇩🇰|🇮🇸|🇪🇸|🇵🇹|🇮🇹|🇦🇹|🇧🇪|🇱🇺|🇵🇱|🇨🇿|🇸🇰|🇭🇺|🇷🇴|🇧🇬|🇬🇷|🇪🇪|🇱🇻|🇱🇹|🇸🇮|🇭🇷|🇷🇸|🇺🇦|欧洲|歐洲|英国|英國|伦敦|倫敦|德国|德國|法兰克福|法蘭克福|荷兰|荷蘭|阿姆斯特丹|法国|法國|巴黎|爱尔兰|愛爾蘭|瑞士|瑞典|芬兰|芬蘭|挪威|丹麦|丹麥|冰岛|冰島|西班牙|葡萄牙|意大利|義大利|奥地利|奧地利|比利时|比利時|卢森堡|盧森堡|波兰|波蘭|捷克|斯洛伐克|匈牙利|罗马尼亚|羅馬尼亞|保加利亚|保加利亞|希腊|希臘|爱沙尼亚|愛沙尼亞|拉脱维亚|拉脫維亞|立陶宛|斯洛文尼亚|斯洛文尼亞|克罗地亚|克羅地亞|塞尔维亚|塞爾維亞|乌克兰|烏克蘭|(^|[^a-z])(eu|uk|gbr|deu?|nld?|fra?|irl|che|swe|fin|nor|dnk|isl|esp|prt|ita|aut|bel|lux|pol|cze|svk|hun|rou|bgr|grc|est|lva|ltu|svn|hrv|srb|ukr)([^a-z]|$)|europe|united[ -]*kingdom|britain|london|germany|frankfurt|netherlands|amsterdam|france|paris|ireland|switzerland|sweden|finland|norway|denmark|iceland|spain|portugal|italy|austria|belgium|luxembourg|poland|czech|slovakia|hungary|romania|bulgaria|greece|estonia|latvia|lithuania|slovenia|croatia|serbia|ukraine'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 其他地区
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/other-regions.png?v=2
    # 首次使用此手动组时，选择需要的机场节点。
    proxies: [REJECT]
    include-all: true
    # 排除内网节点、已命名地区与订阅提示。
    filter: '(?i)^(?!DIRECT$|aTrust$)(?!.*(?:🇭🇰|香港|(^|[^a-z])hkg?([^a-z]|$)|hong[ -]*kong|🇯🇵|日本|东京|東京|大阪|京都|(^|[^a-z])jpn?([^a-z]|$)|japan|tokyo|osaka|🇺🇸|美国|美國|纽约|紐約|洛杉矶|洛杉磯|旧金山|舊金山|西雅图|西雅圖|(^|[^a-z])usa?([^a-z]|$)|america|united[ -]*states|🇸🇬|新加坡|狮城|獅城|(^|[^a-z])sgp?([^a-z]|$)|singapore|🇹🇼|台湾|台灣|臺灣|台北|臺北|高雄|(^|[^a-z])twn?([^a-z]|$)|taiwan|🇰🇷|韩国|韓國|首尔|首爾|釜山|(^|[^a-z])kor?([^a-z]|$)|(^|[^a-z])kr([^a-z]|$)|korea|seoul|busan|🇪🇺|🇬🇧|🇩🇪|🇳🇱|🇫🇷|🇮🇪|🇨🇭|🇸🇪|🇫🇮|🇳🇴|🇩🇰|🇮🇸|🇪🇸|🇵🇹|🇮🇹|🇦🇹|🇧🇪|🇱🇺|🇵🇱|🇨🇿|🇸🇰|🇭🇺|🇷🇴|🇧🇬|🇬🇷|🇪🇪|🇱🇻|🇱🇹|🇸🇮|🇭🇷|🇷🇸|🇺🇦|欧洲|歐洲|英国|英國|伦敦|倫敦|德国|德國|法兰克福|法蘭克福|荷兰|荷蘭|阿姆斯特丹|法国|法國|巴黎|爱尔兰|愛爾蘭|瑞士|瑞典|芬兰|芬蘭|挪威|丹麦|丹麥|冰岛|冰島|西班牙|葡萄牙|意大利|義大利|奥地利|奧地利|比利时|比利時|卢森堡|盧森堡|波兰|波蘭|捷克|斯洛伐克|匈牙利|罗马尼亚|羅馬尼亞|保加利亚|保加利亞|希腊|希臘|爱沙尼亚|愛沙尼亞|拉脱维亚|拉脫維亞|立陶宛|斯洛文尼亚|斯洛文尼亞|克罗地亚|克羅地亞|塞尔维亚|塞爾維亞|乌克兰|烏克蘭|(^|[^a-z])(eu|uk|gbr|deu?|nld?|fra?|irl|che|swe|fin|nor|dnk|isl|esp|prt|ita|aut|bel|lux|pol|cze|svk|hun|rou|bgr|grc|est|lva|ltu|svn|hrv|srb|ukr)([^a-z]|$)|europe|united[ -]*kingdom|britain|london|germany|frankfurt|netherlands|amsterdam|france|paris|ireland|switzerland|sweden|finland|norway|denmark|iceland|spain|portugal|italy|austria|belgium|luxembourg|poland|czech|slovakia|hungary|romania|bulgaria|greece|estonia|latvia|lithuania|slovenia|croatia|serbia|ukraine|剩余流量|剩餘流量|套餐到期|订阅到期|訂閱到期|距离下次重置|距離下次重置|流量重置|到期时间|到期時間|traffic[ _-]*remaining|expire[sd]?|reset[ _-]*date)).+'

  # 优先地区与指定备用地区按需测速；隐藏辅助组定期检查恢复情况。
  - name: 流媒体-日本
