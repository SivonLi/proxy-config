    proxies: [REJECT]
    include-all: true
    # 排除已命名地区与订阅提示；其余节点在此手动选择。
    filter: '(?i)^(?!DIRECT$)(?!.*(?:🇭🇰|香港|(^|[^a-z])hkg?([^a-z]|$)|hong[ -]*kong|🇯🇵|日本|东京|東京|大阪|京都|(^|[^a-z])jpn?([^a-z]|$)|japan|tokyo|osaka|🇺🇸|美国|美國|纽约|紐約|洛杉矶|洛杉磯|旧金山|舊金山|西雅图|西雅圖|(^|[^a-z])usa?([^a-z]|$)|america|united[ -]*states|🇸🇬|新加坡|狮城|獅城|(^|[^a-z])sgp?([^a-z]|$)|singapore|🇹🇼|台湾|台灣|臺灣|台北|臺北|高雄|(^|[^a-z])twn?([^a-z]|$)|taiwan|🇰🇷|韩国|韓國|首尔|首爾|釜山|(^|[^a-z])kor?([^a-z]|$)|(^|[^a-z])kr([^a-z]|$)|korea|seoul|busan|🇪🇺|🇬🇧|🇩🇪|🇳🇱|🇫🇷|🇮🇪|🇨🇭|🇸🇪|🇫🇮|🇳🇴|🇩🇰|🇮🇸|🇪🇸|🇵🇹|🇮🇹|🇦🇹|🇧🇪|🇱🇺|🇵🇱|🇨🇿|🇸🇰|🇭🇺|🇷🇴|🇧🇬|🇬🇷|🇪🇪|🇱🇻|🇱🇹|🇸🇮|🇭🇷|🇷🇸|🇺🇦|欧洲|歐洲|英国|英國|伦敦|倫敦|德国|德國|法兰克福|法蘭克福|荷兰|荷蘭|阿姆斯特丹|法国|法國|巴黎|爱尔兰|愛爾蘭|瑞士|瑞典|芬兰|芬蘭|挪威|丹麦|丹麥|冰岛|冰島|西班牙|葡萄牙|意大利|義大利|奥地利|奧地利|比利时|比利時|卢森堡|盧森堡|波兰|波蘭|捷克|斯洛伐克|匈牙利|罗马尼亚|羅馬尼亞|保加利亚|保加利亞|希腊|希臘|爱沙尼亚|愛沙尼亞|拉脱维亚|拉脫維亞|立陶宛|斯洛文尼亚|斯洛文尼亞|克罗地亚|克羅地亞|塞尔维亚|塞爾維亞|乌克兰|烏克蘭|(^|[^a-z])(eu|uk|gbr|deu?|nld?|fra?|irl|che|swe|fin|nor|dnk|isl|esp|prt|ita|aut|bel|lux|pol|cze|svk|hun|rou|bgr|grc|est|lva|ltu|svn|hrv|srb|ukr)([^a-z]|$)|europe|united[ -]*kingdom|britain|london|germany|frankfurt|netherlands|amsterdam|france|paris|ireland|switzerland|sweden|finland|norway|denmark|iceland|spain|portugal|italy|austria|belgium|luxembourg|poland|czech|slovakia|hungary|romania|bulgaria|greece|estonia|latvia|lithuania|slovenia|croatia|serbia|ukraine|剩余流量|剩餘流量|套餐到期|订阅到期|訂閱到期|距离下次重置|距離下次重置|流量重置|到期时间|到期時間|traffic[ _-]*remaining|expire[sd]?|reset[ _-]*date)).+'
