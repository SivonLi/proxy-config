rules:
  # 提前拦截进入分流引擎的 IPv4 / IPv6 TCP、UDP 明文 DNS。
  - DST-PORT,53,REJECT,pre-matching
  # 全部域名规则先于 IP 规则；命中代理的 TCP 请求交给对应节点解析。
  - RULE-SET,corporate-domains,DIRECT
  - RULE-SET,lan,DIRECT
  # 提前拦截的条件内排除公司域名；高频重试集合优先使用 REJECT-DROP。
  - AND,((RULE-SET,reject-drop),(NOT,((RULE-SET,corporate-domains)))),REJECT-DROP,pre-matching
  - AND,((RULE-SET,reject-domain),(NOT,((RULE-SET,corporate-domains)))),REJECT,pre-matching
  - AND,((RULE-SET,reject-extra),(NOT,((RULE-SET,corporate-domains)))),REJECT,pre-matching
  - AND,((RULE-SET,reject-phishing),(NOT,((RULE-SET,corporate-domains)))),REJECT,pre-matching
  - AND,((RULE-SET,reject),(NOT,((RULE-SET,corporate-domains)))),REJECT,pre-matching
  - AND,((RULE-SET,reject-no-drop),(NOT,((RULE-SET,corporate-domains)))),REJECT,pre-matching
  - AND,((RULE-SET,awavenue),(NOT,((RULE-SET,corporate-domains)))),REJECT,pre-matching
  # 此集合含 PROCESS-NAME，使用普通匹配。
  - RULE-SET,sogouinput,REJECT
  - RULE-SET,onepassword,DIRECT
  - RULE-SET,lark,Lark
  - RULE-SET,ai,AI
  - RULE-SET,apple-intelligence,AI
  - RULE-SET,speedtest,测速
  - RULE-SET,apple-cdn,DIRECT
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,apple-services,Apple
  - RULE-SET,microsoft-cdn,DIRECT
  - RULE-SET,microsoft,Microsoft
  # 日本集合先于美国集合，两者均包含 Hulu Japan。
  - RULE-SET,stream-jp,流媒体-日本
  - RULE-SET,stream-us,流媒体-美国
  - RULE-SET,stream-eu,流媒体-欧洲
  - RULE-SET,stream-kr,流媒体-韩国
  # Bilibili 国际版也被香港集合收录，专用策略优先。
  - RULE-SET,stream-biliintl,流媒体-台湾
  - RULE-SET,stream-hk,流媒体-香港
  - RULE-SET,stream-tw,流媒体-台湾
  - RULE-SET,stream,默认代理
  - RULE-SET,telegram,默认代理
  - RULE-SET,download-domain,下载
  - RULE-SET,download,下载
  - RULE-SET,direct,DIRECT
  - RULE-SET,domestic,DIRECT
  # 服务专用、下载和国内域名优先于通用 CDN。
  - RULE-SET,cdn-domain,默认代理
  - RULE-SET,cdn,默认代理
  - RULE-SET,global,默认代理
  # 未命中域名规则时，通过国内 DoH 查询真实地址，供后续 IP 规则判断。
  - RULE-SET,lan-ip,DIRECT
  # 私有地址优先直连；拦截恶意 IP 时复用已有解析结果。
  - RULE-SET,reject-ip,REJECT-DROP,no-resolve
  - RULE-SET,ai-ip,AI,no-resolve
  - RULE-SET,apple-services-ip,Apple,no-resolve
  - RULE-SET,stream-ip,默认代理,no-resolve
  - RULE-SET,telegram-ip,默认代理,no-resolve
  - RULE-SET,telegram-asn,默认代理,no-resolve
  - RULE-SET,download-ip,下载,no-resolve
  - RULE-SET,neteasemusic-ip,DIRECT,no-resolve
  - RULE-SET,cdn-ip,默认代理,no-resolve
  - RULE-SET,domestic-ip,DIRECT,no-resolve
  - RULE-SET,china-ip,DIRECT
  - RULE-SET,china-ipv6,DIRECT
  - MATCH,默认代理
