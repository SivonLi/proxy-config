# iOS 3.7+ / macOS 4.4+ / Windows；节点订阅通过 Subscribe.stoverride 导入。
mode: rule
log-level: warning
# Stash 自身仅解析 IPv4；IPv6 流量接管仍需启用 Tunnel IPv6 路由。
ipv6: false

dns:
  # 内置 DNS 直连国内 DoH；Fake-IP 代理 TCP 连接由所选节点解析目标域名。
  follow-rule: false
  # 仅控制应用的 AAAA 查询；IPv6 流量接管需要在 Stash 界面启用。
  ipv6: false
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
  # 公司域名交给系统解析，沿用 aTrust 的内网解析能力。
  nameserver-policy:
    'rule-set:corporate-domains': system
  # 公司、局域网与 Sukka 真实地址例外返回真实 IP。
  fake-ip-filter:
    - 'rule-set:corporate-domains'
    - 'rule-set:lan'
    - 'rule-set:fake-ip-exclude'

# 已启用的机场覆写向此处添加节点订阅；每个机场使用不同名称。
proxy-providers: {}

# 手动分组关闭定时测速；命名地区按需测速，其他地区手动选择节点。
proxy-groups:
  - name: 默认代理
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/proxy.png?v=2
    proxies: [香港, 日本, 美国, 新加坡, 台湾, 韩国, 欧洲, 其他地区]
    interval: -1
    lazy: true
  - name: AI
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/apple-intelligence.png?v=2
    proxies: [新加坡, 美国, 日本, 台湾, 韩国, 欧洲, 其他地区]
    interval: -1
    lazy: true
  - name: Lark
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/lark.png?v=2
    proxies: [日本, 默认代理]
    interval: -1
    lazy: true
  - name: Apple
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/apple.png?v=2
    proxies: [DIRECT, 默认代理, 美国]
    interval: -1
    lazy: true
  - name: Microsoft
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/microsoft.png?v=2
    proxies: [DIRECT, 默认代理]
    interval: -1
    lazy: true
  - name: 下载
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/download.png?v=2
    proxies: [默认代理, DIRECT]
    interval: -1
    lazy: true
  - name: 测速
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/speedtest.png?v=2
    proxies: [DIRECT, 香港, 日本, 美国, 新加坡, 台湾, 韩国, 欧洲, 其他地区]
    interval: -1
    lazy: true
  # REJECT 保证地区组始终非空；自动选择会跳过这个不可用出口。
  - name: 香港
    type: url-test
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/hong-kong.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇭🇰|香港|(^|[^a-z])hkg?([^a-z]|$)|hong[ -]*kong'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 日本
    type: url-test
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/japan.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇯🇵|日本|东京|東京|大阪|京都|(^|[^a-z])jpn?([^a-z]|$)|japan|tokyo|osaka'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 美国
    type: url-test
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/united-states.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇺🇸|美国|美國|纽约|紐約|洛杉矶|洛杉磯|旧金山|舊金山|西雅图|西雅圖|(^|[^a-z])usa?([^a-z]|$)|america|united[ -]*states'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 新加坡
    type: url-test
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/singapore.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇸🇬|新加坡|狮城|獅城|(^|[^a-z])sgp?([^a-z]|$)|singapore'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 台湾
    type: url-test
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/taiwan.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇹🇼|台湾|台灣|臺灣|台北|臺北|高雄|(^|[^a-z])twn?([^a-z]|$)|taiwan'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 韩国
    type: url-test
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/korea.png?v=2
    proxies: [REJECT]
    include-all: true
    filter: '(?i)^REJECT$|🇰🇷|韩国|韓國|首尔|首爾|釜山|(^|[^a-z])kor?([^a-z]|$)|(^|[^a-z])kr([^a-z]|$)|korea|seoul|busan'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 欧洲
    type: url-test
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/europe.png?v=2
    proxies: [REJECT]
    include-all: true
    # 英国、德国、荷兰等欧洲节点统一参与测速。
    filter: '(?i)^REJECT$|🇪🇺|🇬🇧|🇩🇪|🇳🇱|🇫🇷|🇮🇪|🇨🇭|🇸🇪|🇫🇮|🇳🇴|🇩🇰|🇮🇸|🇪🇸|🇵🇹|🇮🇹|🇦🇹|🇧🇪|🇱🇺|🇵🇱|🇨🇿|🇸🇰|🇭🇺|🇷🇴|🇧🇬|🇬🇷|🇪🇪|🇱🇻|🇱🇹|🇸🇮|🇭🇷|🇷🇸|🇺🇦|欧洲|歐洲|英国|英國|伦敦|倫敦|德国|德國|法兰克福|法蘭克福|荷兰|荷蘭|阿姆斯特丹|法国|法國|巴黎|爱尔兰|愛爾蘭|瑞士|瑞典|芬兰|芬蘭|挪威|丹麦|丹麥|冰岛|冰島|西班牙|葡萄牙|意大利|義大利|奥地利|奧地利|比利时|比利時|卢森堡|盧森堡|波兰|波蘭|捷克|斯洛伐克|匈牙利|罗马尼亚|羅馬尼亞|保加利亚|保加利亞|希腊|希臘|爱沙尼亚|愛沙尼亞|拉脱维亚|拉脫維亞|立陶宛|斯洛文尼亚|斯洛文尼亞|克罗地亚|克羅地亞|塞尔维亚|塞爾維亞|乌克兰|烏克蘭|(^|[^a-z])(eu|uk|gbr|deu?|nld?|fra?|irl|che|swe|fin|nor|dnk|isl|esp|prt|ita|aut|bel|lux|pol|cze|svk|hun|rou|bgr|grc|est|lva|ltu|svn|hrv|srb|ukr)([^a-z]|$)|europe|united[ -]*kingdom|britain|london|germany|frankfurt|netherlands|amsterdam|france|paris|ireland|switzerland|sweden|finland|norway|denmark|iceland|spain|portugal|italy|austria|belgium|luxembourg|poland|czech|slovakia|hungary|romania|bulgaria|greece|estonia|latvia|lithuania|slovenia|croatia|serbia|ukraine'
    interval: 600
    tolerance: 50
    lazy: true
  - name: 其他地区
    type: select
    icon: https://raw.githubusercontent.com/SivonLi/proxy-config/configs/stash/icons/rounded/other-regions.png?v=2
